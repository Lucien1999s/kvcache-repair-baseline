[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow"
version = "0.1.0"
description = "Research prototype for RAG KV cache reuse, repair, and memory workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
datasets = [
    "datasets",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
